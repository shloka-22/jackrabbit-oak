name: NonDex Flaky Test Check
on: [push]
jobs:
  nondex-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build dependencies
        run: mvn clean install -DskipTests -pl oak-auth-ldap -am

      - name: Run normal test
        run: mvn -pl oak-auth-ldap test -Dtest=org.apache.jackrabbit.oak.security.authentication.ldap.GuestTokenDefaultLdapLoginModuleTest#testLoginSetsAuthInfo

      - name: Run NonDex test
        run: mvn -pl oak-auth-ldap edu.illinois:nondex-maven-plugin:2.1.1:nondex -Dtest=org.apache.jackrabbit.oak.security.authentication.ldap.GuestTokenDefaultLdapLoginModuleTest#testLoginSetsAuthInfo
